<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padel Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: één smalle kolom, formulier bovenaan, uitslag als groot "scorebord" eronder */
:root{
  --court:#1f4f8f;      /* padelbaan-blauw */
  --court-deep:#163a6b;
  --ball:#e4f04a;       /* padelbal-geel */
  --bg:#eef2f7;
  --surface:#ffffff;
  --fg:#14233a;
  --muted:#5b6b82;
  --line:#d3dbe6;
  --in:#c2410c;         /* binnen */
  --out:#15803d;        /* buiten */
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1522; --surface:#152132; --fg:#e8eef7; --muted:#9aaac0; --line:#26354b;
    --court:#2f6bb8; --court-deep:#1d4a85; --in:#fb923c; --out:#4ade80;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg); font:16px/1.5 var(--body);
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);
}
.wrap{max-width:560px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;flex:none}
h1{font:800 2rem/1 var(--display);margin:0;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}

form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
input,select{
  font:500 1rem var(--body);color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0;
}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--court);outline-offset:2px}
.loc{display:flex;gap:8px}
.loc input{flex:1}
.ghost{flex:none;background:transparent;border:1px solid var(--line);color:var(--court);border-radius:10px;padding:0 12px;font:600 .9rem var(--body);cursor:pointer}
@media (prefers-color-scheme: dark){.ghost{color:#8ab8f0}}
.go{
  background:var(--court);color:#fff;border:0;border-radius:10px;padding:14px;
  font:700 1.05rem var(--display);letter-spacing:.02em;cursor:pointer;
}
.go:hover{background:var(--court-deep)}
.go[disabled]{opacity:.6;cursor:wait}

.result{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.verdict{padding:26px 20px;color:#fff;display:flex;flex-direction:column;gap:6px;position:relative}
.verdict.in{background:var(--in)}
.verdict.out{background:var(--out)}
@media (prefers-color-scheme: dark){.verdict{color:#0d1522}}
.verdict .big{font:800 clamp(2.2rem,9vw,3.2rem)/1 var(--display);letter-spacing:-.02em;text-wrap:balance}
.verdict .why{font-size:1rem;opacity:.95}
.meta{padding:14px 20px;color:var(--muted);font-size:.9rem;border-bottom:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font:700 1.35rem var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sources{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:9px 20px;text-align:left;white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.num{text-align:right}th.num{text-align:right}
tr+tr td{border-top:1px solid var(--line)}
.wet{color:var(--in);font-weight:600}
.err{background:var(--surface);border:1px solid var(--in);color:var(--fg);border-radius:12px;padding:14px 16px}
.rule{color:var(--muted);font-size:.85rem;margin:0}
@media (max-width:420px){.row{grid-template-columns:1fr}.stat{padding:12px}}
@media (prefers-reduced-motion:no-preference){.result{animation:pop .35s ease-out}}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="20" fill="var(--ball)"/>
      <path d="M6 14c8 4 8 12 0 16M38 14c-8 4-8 12 0 16" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>Padel Weather</h1>
      <p class="sub">Binnen of buiten? Kies dag, uur en plaats.</p>
    </div>
  </header>

  <form id="f">
    <div class="row">
      <label for="date">Dag<input id="date" type="date" required></label>
      <label for="hour">Uur<select id="hour"></select></label>
    </div>
    <label for="place">Locatie
      <span class="loc">
        <input id="place" type="text" value="Wortegem" placeholder="Stad of gemeente" required autocomplete="off">
        <button type="button" class="ghost" id="gps" title="Gebruik mijn huidige locatie">📍 Hier</button>
      </span>
    </label>
    <button class="go" id="go" type="submit">Check het weer</button>
    <p class="rule">Binnen spelen bij regen of minder dan 10 °C. We vergelijken vijf weermodellen.</p>
  </form>

  <div id="out" aria-live="polite"></div>
</div>

<script>
const MODELS = [
  ["icon_seamless","DWD ICON (Duitsland)"],
  ["ecmwf_ifs025","ECMWF (Europa)"],
  ["meteofrance_seamless","Météo-France"],
  ["ukmo_seamless","UK Met Office"],
  ["gfs_seamless","NOAA GFS (VS)"]
];
const RAIN_MM = 0.2;   // vanaf deze hoeveelheid neerslag per uur telt het als regen
const MIN_TEMP = 10;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

// datum: vandaag t/m +15 dagen (bereik van de voorspellingen)
const today = new Date(), max = new Date(); max.setDate(max.getDate()+15);
const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
$("date").min = iso(today); $("date").max = iso(max); $("date").value = iso(tomorrow);
for(let h=6;h<=23;h++){const o=new Option(`${pad(h)}:00`,h);if(h===19)o.selected=true;$("hour").add(o)}

let coords = null; // gezet door "Hier"-knop
$("place").addEventListener("input",()=>{coords=null});
$("gps").addEventListener("click",()=>{
  if(!navigator.geolocation){showErr("Je browser kan je locatie niet doorgeven. Typ een plaatsnaam.");return}
  $("gps").textContent="…";
  navigator.geolocation.getCurrentPosition(p=>{
    coords={lat:p.coords.latitude,lon:p.coords.longitude,name:"Huidige locatie"};
    $("place").value="Huidige locatie";$("gps").textContent="📍 Hier";
  },()=>{$("gps").textContent="📍 Hier";showErr("Locatie niet beschikbaar. Typ een plaatsnaam.")},{timeout:10000});
});

async function geocode(q){
  const u=`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=nl&format=json`;
  const r=await fetch(u); if(!r.ok) throw new Error("geo");
  const j=await r.json();
  if(!j.results?.length) return null;
  const g=j.results[0];
  return {lat:g.latitude,lon:g.longitude,name:[g.name,g.admin1,g.country].filter(Boolean).join(", ")};
}

// Haalt één model op; null als dat model niet beschikbaar is
async function fetchModel(loc,date,model){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat.toFixed(4)}&longitude=${loc.lon.toFixed(4)}`+
    `&hourly=temperature_2m,precipitation,wind_speed_10m`+(model?`&models=${model}`:"")+
    `&timezone=auto&start_date=${date}&end_date=${date}`;
  const r=await fetch(u);
  if(!r.ok) return null;
  return r.json();
}

// Vraagt alle modellen parallel op; valt terug op het standaardmodel als ze allemaal falen
async function forecast(loc,date,hour){
  const tag=`T${pad(hour)}:00`;
  const pick=(j,label)=>{
    if(!j?.hourly) return {label,temp:null,rain:null,wind:null};
    const h=j.hourly, i=h.time.findIndex(t=>t.endsWith(tag));
    return {label,temp:h.temperature_2m?.[i]??null,rain:h.precipitation?.[i]??null,wind:h.wind_speed_10m?.[i]??null};
  };
  const res=await Promise.allSettled(MODELS.map(([k])=>fetchModel(loc,date,k)));
  const netFail=res.every(r=>r.status==="rejected");
  if(netFail) throw new Error("network");
  let rows=res.map((r,n)=>pick(r.status==="fulfilled"?r.value:null,MODELS[n][1]));
  if(rows.every(r=>r.temp==null)){
    const j=await fetchModel(loc,date,null);
    rows=[pick(j,"Open-Meteo (beste model)")];
  }
  return rows;
}

// pure beslisfunctie
function decide(rows){
  const valid=rows.filter(r=>r.temp!=null);
  if(!valid.length) return null;
  const avg=k=>valid.reduce((s,r)=>s+(r[k]??0),0)/valid.length;
  const temp=avg("temp"), rain=avg("rain"), wind=avg("wind");
  const wetCount=valid.filter(r=>(r.rain??0)>=RAIN_MM).length;
  const raining=wetCount*2>=valid.length;           // minstens de helft van de modellen voorspelt regen
  const cold=temp<MIN_TEMP;
  let why;
  if(raining&&cold) why=`Regen verwacht en maar ${temp.toFixed(1)} °C.`;
  else if(raining) why=`${wetCount} van ${valid.length} weermodellen voorspellen regen.`;
  else if(cold) why=`Droog, maar slechts ${temp.toFixed(1)} °C.`;
  else why=`Droog en ${temp.toFixed(1)} °C. Veel speelplezier!`;
  return {inside:raining||cold,why,temp,rain,wind,wetCount,n:valid.length};
}

function showErr(msg){$("out").innerHTML=`<div class="err">${msg}</div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const date=$("date").value, hour=+$("hour").value, q=$("place").value.trim();
  if(!date||!q) return;
  $("go").disabled=true;$("go").textContent="Weerapps checken…";
  try{
    const loc=coords??await geocode(q);
    if(!loc){showErr(`Plaats "${esc(q)}" niet gevonden. Probeer een andere schrijfwijze.`);return}
    const rows=await forecast(loc,date,hour);
    const d=decide(rows);
    if(!d){showErr("Nog geen voorspelling beschikbaar voor dat moment. Kies een dag dichterbij.");return}
    const dayTxt=new Date(date+"T12:00").toLocaleDateString("nl-BE",{weekday:"long",day:"numeric",month:"long"});
    $("out").innerHTML=`
      <section class="result">
        <div class="verdict ${d.inside?"in":"out"}">
          <span class="big">${d.inside?"Binnen spelen!":"Buiten spelen"}</span>
          <span class="why">${esc(d.why)}</span>
        </div>
        <div class="meta">${esc(loc.name)} · ${dayTxt} om ${pad(hour)}:00</div>
        <div class="stats">
          <div class="stat"><b>${d.temp.toFixed(1)}°</b><span>Temperatuur</span></div>
          <div class="stat"><b>${d.rain.toFixed(1)}</b><span>mm regen</span></div>
          <div class="stat"><b>${Math.round(d.wind)}</b><span>km/u wind</span></div>
        </div>
        <div class="sources"><table>
          <thead><tr><th>Weermodel</th><th class="num">°C</th><th class="num">mm</th></tr></thead>
          <tbody>${rows.map(r=>r.temp==null
            ?`<tr><td>${r.label}</td><td class="num" colspan="2">geen data</td></tr>`
            :`<tr><td>${r.label}</td><td class="num">${r.temp.toFixed(1)}</td><td class="num ${(r.rain??0)>=RAIN_MM?"wet":""}">${(r.rain??0).toFixed(1)}</td></tr>`).join("")}
          </tbody></table></div>
      </section>`;
  }catch(err){
    showErr("Deze app mag geen verbinding maken met internet. Dat gebeurt als je het bestand opent in de voorbeeldweergave van Claude of van de Bestanden-app. Open het in Safari of Chrome, of zet het online via app.netlify.com/drop.");
  }finally{
    $("go").disabled=false;$("go").textContent="Check het weer";
  }
});
</script>
</body>
</html>
